version: '3.8'

services:
  agent-api-flask:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=false
      - DOCS_ENABLED=false
      - FLASK_DEBUG=false
    volumes:
      # Mount for development (optional)
      # - .:/app
      # Mount for logs
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

